name: test

on:
  push:
  pull_request:

jobs:
  random-forest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn==1.6.1
      - run: python -m unittest tests/test_rf.py
